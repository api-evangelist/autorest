note: >-
  AutoRest is a code-generation TOOL, not a hosted API. Its "packages" are the
  first-party npm distributions of the CLI, the core engine, the language
  generator plugins, and the shared libraries — all published by Microsoft under
  the @autorest and @azure-tools npm scopes. Versions and licenses below were
  read live from the npm registry on 2026-08-06. AutoRest is deprecated with a
  retirement date of 2026-07-01; see lifecycle/autorest-lifecycle.yml.
